@let a = article();
<a class="carte" [class.carte--grande]="grande()" [routerLink]="['/actualites', a.id]">
  <div class="carte__image">
    <!-- srcset + sizes : le navigateur télécharge la photo de 800 px pour une petite carte, celle de 1920 px
         seulement si elle s'affiche en grand. La grande carte (à la une) est chargée en priorité. -->
    <img
      [src]="a.image"
      [attr.srcset]="srcset()"
      [attr.sizes]="grande() ? '(max-width: 1024px) 100vw, 60vw' : '(max-width: 640px) 100vw, (max-width: 1024px) 50vw, 33vw'"
      alt=""
      width="1600"
      height="900"
      [attr.loading]="grande() ? null : 'lazy'"
      [attr.fetchpriority]="grande() ? 'high' : null"
    />
  </div>
  <div class="carte__texte">
    <p class="carte__infos">
      <span class="carte__categorie">{{ categorie() | t }}</span>
      <span aria-hidden="true">·</span>
      <time [attr.datetime]="a.date">{{ date() }}</time>
    </p>
    <h3 class="carte__titre">{{ a.titre }}</h3>
    <p class="carte__chapo">{{ a.chapo }}</p>
    <span class="carte__lire" aria-hidden="true">{{ 'actu.lire' | t }}</span>
  </div>
</a>
