@let a = article();
<a class="carte" [class.carte--grande]="grande()" [routerLink]="['/actualites', a.id]">
  <div class="carte__image">
    <img [src]="a.image" alt="" width="1600" height="900" [attr.loading]="grande() ? null : 'lazy'" />
  </div>
  <div class="carte__texte">
    <p class="carte__infos">
      <span class="carte__categorie">{{ categorie() | t }}</span>
      <span aria-hidden="true">·</span>
      <time [attr.datetime]="a.date">{{ date() }}</time>
    </p>
    <h3 class="carte__titre">{{ a.titre }}</h3>
    <p class="carte__chapo">{{ a.chapo }}</p>
    <span class="carte__lire" aria-hidden="true">{{ 'actu.lire' | t }}</span>
  </div>
</a>
