<article class="carte">
  <a class="carte__affiche" [routerLink]="['/film', film().id]" tabindex="-1" aria-hidden="true">
    <img [src]="film().affiche" alt="" width="600" height="900" loading="lazy" />
  </a>

  <p class="etiquette">
    {{ enSalle() ? ('carte.enSalle' | t) : ('carte.desLe' | t: { date: dateSortie() }) }}
  </p>
  <h3 class="carte__titre">
    <a [routerLink]="['/film', film().id]">{{ film().titre }}</a>
  </h3>
  <p class="carte__infos">{{ film().genre }} · {{ duree() }}</p>

  <a class="bouton" [routerLink]="['/film', film().id]">
    {{ (enSalle() ? 'commun.reserver' : 'commun.mePrevenir') | t }}
  </a>
</article>
